name: Build

on:
  push:
    branches: [main, experimental]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # 22.04 for an older glibc, so the binary runs on more distributions
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libfreetype-dev
      - run: cargo test --release
      - run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: echo "PKG=$(scripts/dmg.sh)" >> "$GITHUB_ENV"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release
          PKG="Realtime-Tex-Desktop-$VERSION-${{ matrix.target }}.zip"
          7z a "$PKG" ./target/release/realtime-tex-desktop.exe
          echo "PKG=$PKG" >> "$GITHUB_ENV"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          PKG="Realtime-Tex-Desktop-$VERSION-${{ matrix.target }}.tar.gz"
          tar -czf "$PKG" -C target/release realtime-tex-desktop
          echo "PKG=$PKG" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Realtime-Tex-Desktop-${{ env.VERSION }}-${{ matrix.target }}
          path: ${{ env.PKG }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes --repo "$GITHUB_REPOSITORY" dist/*
        env:
          GH_TOKEN: ${{ github.token }}
