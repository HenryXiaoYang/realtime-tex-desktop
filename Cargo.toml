[package]
name = "realtime-tex-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
futures = "0.3"
gpui-kit = { version = "0.9.0", features = ["syntect"] }
hayro = "0.9"
lsp-types = { version = "0.97", features = ["proposed"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.49"
tiny-skia = "0.12.0"
unicode-segmentation = "1"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSGeometry"] }



[dev-dependencies]
gpui-kit = { version = "0.9.0", features = ["syntect", "test-support"] }
